server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Angular routes are client-side; unknown paths return the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The shell must never be cached.
  #
  # Without an explicit Cache-Control a browser applies heuristic caching and
  # serves this without revalidating — and because it names the hashed bundle
  # files, a stale copy keeps loading the previous build's JavaScript. That is
  # the whole "I rebuilt but nothing changed" class of problem, and it cannot be
  # fixed by rebuilding harder.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Everything the build fingerprints is safe to keep forever: a new build
  # produces a new filename, so there is nothing to invalidate.
  location ~* "-[A-Z0-9]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Same-origin API, so no CORS and no API host baked into the bundle.
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Notification sends reach out to Power Automate, which can be slow.
    proxy_read_timeout 60s;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
