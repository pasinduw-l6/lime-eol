# Technology versions per project, read by the Lime EOL tool.
#
# Edit a version, commit and push to main: within 15 minutes the tool records the
# change in the project's history, with the commit, the author and the date.
#
#   PROJECT-CODE:        code of the project in the EOL tool
#     DEV / UAT / PROD:  environment
#       Technology: version   (name as in Lifecycle → Registry, e.g. Node.js, Angular)
#
# DEV = upgraded internally, PROD = released to production.
# When DEV is ahead of PROD, the Overview shows "Awaiting release".

DBANK:
